[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ccw-tcc-prototype"
version = "0.2.0"
description = "Reproducible educational interaction and modeling pipeline for the CCW TCC prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "scikit-learn==1.6.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5"
]

[project.scripts]
tcc-prototype = "tcc_prototype.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tcc_prototype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
