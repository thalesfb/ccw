name: Deploy Reports to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Validate exports exist
        run: |
          echo "🔍 Validating pre-generated reports..."
          
          # Check required directories
          if [ ! -d "research/exports/reports" ]; then
            echo "❌ ERROR: research/exports/reports/ not found"
            echo "Run: python -m research.src.cli export"
            exit 1
          fi
          
          if [ ! -d "research/exports/visualizations" ]; then
            echo "❌ ERROR: research/exports/visualizations/ not found"
            echo "Run: python -m research.src.cli export"
            exit 1
          fi
          
          # Check required files (sem timestamps)
          REQUIRED_FILES=(
            "research/exports/reports/summary_report.html"
            "research/exports/reports/papers_report_included.html"
            "research/exports/reports/gap_analysis.html"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: $file not found"
              echo "Run: python -m research.src.cli export"
              exit 1
            fi
            echo "✅ Found: $file"
          done
          
          # Validate visualizations
          VIZ_COUNT=$(ls -1 research/exports/visualizations/*.png 2>/dev/null | wc -l)
          if [ "$VIZ_COUNT" -lt 6 ]; then
            echo "⚠️ WARNING: Expected 6 visualizations, found $VIZ_COUNT"
          else
            echo "✅ Found $VIZ_COUNT visualization(s)"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: presentation/package-lock.json

      - name: Install presentation dependencies
        working-directory: presentation
        run: npm ci

      - name: Validate presentation content
        working-directory: presentation
        run: npm run validate

      - name: Build presentation
        working-directory: presentation
        run: npm run build -- --base /ccw/presentation/
      
      - name: Prepare Pages content
        run: |
          echo "📦 Preparing content for GitHub Pages..."
          mkdir -p _site
          
          # Copy main index.html (projeto principal)
          cp index.html _site/index.html
          
          # Create research directory structure  
          mkdir -p _site/research
          cp -r research/exports _site/research/
          # Copy main research index.html for /research/
          cp research/index.html _site/research/index.html
          
          # Copy results directory (PTC and TCC)
          mkdir -p _site/results
          cp -r results/ptc _site/results/
          if [ -d "results/tcc" ]; then
            cp -r results/tcc _site/results/
          fi
          test -d "presentation/dist"
          cp -r presentation/dist _site/presentation
          echo "✅ Copied results/ directory"
          echo "✅ Copied presentation/ directory"
          
          # Create .nojekyll to bypass Jekyll processing
          touch _site/.nojekyll
          
          # Summary
          echo ""
          echo "� Site structure:"
          ls -lh _site/
          echo ""
          echo "📊 Research structure:"
          ls -lh _site/research/exports/
          echo ""
          echo "📄 Results structure:"
          ls -lh _site/results/
          echo ""
          echo "✅ Site prepared successfully"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
