name: TCC quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            research/requirements.txt
            prototype/pyproject.toml

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt pytest

      - name: Install prototype dependencies
        run: python -m pip install -e "prototype[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q research/src
          python -m compileall -q prototype/tcc_prototype

      - name: Validate versioned research snapshot
        working-directory: research
        run: python -m src.validation.versioned_snapshot

      - name: Validate approved adjudication replay
        run: python -m research.src.processing.adjudicated_snapshot --check

      - name: Check bibliography audit coverage
        working-directory: research
        run: python -m src.validation.bibliography_audit

      - name: Check generated MMAT table
        working-directory: research
        run: python -m src.analysis.mmat_tcc_table --check

      - name: Check current MMAT table used by the TCC
        working-directory: research
        run: python -m src.analysis.mmat_current_tcc_table --check

      - name: Check canonical MMAT CSV export
        working-directory: research
        run: cmp data/mmat_assessments.csv exports/analysis/mmat_assessment.csv

      - name: Run research regression tests
        working-directory: research
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_bibliography_audit.py \
            tests/test_experiment_contract.py \
            tests/test_mmat.py \
            tests/test_mmat_artifacts.py \
            tests/test_temporal_scope.py \
            tests/test_adjudicated_snapshot.py \
            tests/test_tcc_advisor_feedback.py \
            tests/test_versioned_snapshot.py \
            -q --tb=short 2>&1 | tee advisor-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Run prototype regression tests
        shell: bash
        run: |
          set +e
          python -m pytest prototype/tests -q --tb=short 2>&1 | tee prototype-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload source-validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-source-validation
          path: |
            research/advisor-tests.log
            prototype-tests.log
          if-no-files-found: warn
          retention-days: 7

  latex-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-lang-portuguese \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic

      - name: Prepare legacy IFC template paths
        working-directory: results/tcc
        run: |
          test -d abnetx2
          ln -sfn abnetx2 abntex2

      - name: Compile TCC
        working-directory: results/tcc
        run: |
          if ! latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex > build.log 2>&1; then
            echo "LaTeX compilation failed. Last 120 lines:"
            tail -n 120 build.log
            exit 1
          fi

      - name: Upload LaTeX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-latex-diagnostics
          path: |
            results/tcc/build.log
            results/tcc/main.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiled TCC
        uses: actions/upload-artifact@v4
        with:
          name: tcc-pdf
          path: results/tcc/main.pdf
          if-no-files-found: error
          retention-days: 7

  canonical-pdf-sync:
    name: canonical-pdf-sync
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: latex-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Determine whether the canonical PDF is stale
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          pdf_commit="$(git log -1 --format=%H -- results/tcc/main.pdf || true)"
          stale=false

          if [ -z "$pdf_commit" ]; then
            stale=true
          elif ! git merge-base --is-ancestor "$pdf_commit" HEAD; then
            stale=true
          elif ! git diff --quiet "$pdf_commit"..HEAD -- \
            results/tcc \
            ':(exclude)results/tcc/main.pdf' \
            ':(exclude)results/tcc/index.html' \
            ':(exclude)results/tcc/README.md'; then
            stale=true
          fi

          echo "pdf_commit=${pdf_commit:-none}"
          echo "stale=$stale"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Download compiled PDF from this workflow run
        if: steps.canonical.outputs.stale == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tcc-pdf
          path: _compiled_tcc

      - name: Validate compiled PDF
        if: steps.canonical.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s _compiled_tcc/main.pdf
          test "$(head -c 5 _compiled_tcc/main.pdf)" = "%PDF-"

      - name: Update canonical PDF on the pull request branch
        id: sync
        if: steps.canonical.outputs.stale == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp _compiled_tcc/main.pdf results/tcc/main.pdf

          if git diff --quiet -- results/tcc/main.pdf; then
            echo "Canonical PDF is already current."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tcc/main.pdf
          git commit -m ":books: docs(tcc): refresh compiled PDF"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Validate the synchronized branch head
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run tcc-quality.yml --ref "${{ github.head_ref }}"
