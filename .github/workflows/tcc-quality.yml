name: TCC quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            research/requirements.txt
            prototype/pyproject.toml

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt pytest

      - name: Install prototype dependencies
        run: python -m pip install -e "prototype[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q research/src
          python -m compileall -q prototype/tcc_prototype

      - name: Test read-only canonical PDF verification
        run: python -m unittest discover -s scripts/tests -p test_canonical_pdf.py -v

      - name: Validate derived visualization synchronization
        run: python -m research.src.validation.derived_assets --check

      - name: Validate versioned research snapshot
        working-directory: research
        run: python -m src.validation.versioned_snapshot

      - name: Validate approved adjudication replay
        run: python -m research.src.processing.adjudicated_snapshot --check

      - name: Check bibliography audit coverage
        working-directory: research
        run: python -m src.validation.bibliography_audit

      - name: Check generated MMAT table
        working-directory: research
        run: python -m src.analysis.mmat_tcc_table --check

      - name: Check current MMAT table used by the TCC
        working-directory: research
        run: python -m src.analysis.mmat_current_tcc_table --check

      - name: Check canonical MMAT CSV export
        working-directory: research
        run: cmp data/mmat_assessments.csv exports/analysis/mmat_assessment.csv

      - name: Run research regression tests
        working-directory: research
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_bibliography_audit.py \
            tests/test_tcc_normalization.py \
            tests/test_experiment_contract.py \
            tests/test_mmat.py \
            tests/test_mmat_artifacts.py \
            tests/test_mmat_current.py \
            tests/test_study_scope.py \
            tests/test_study_contribution_coverage.py \
            tests/test_defense_consistency.py \
            tests/test_mmat_source_integrity.py \
            tests/test_temporal_scope.py \
            tests/test_adjudicated_snapshot.py \
            tests/test_tcc_advisor_feedback.py \
            tests/test_he_article_reporting_caution.py \
            tests/test_missing_doi_dedup.py \
            tests/test_tcc_visual_classification.py \
            tests/test_pdf_feedback.py \
            tests/test_evidence_retrieval.py \
            tests/test_claim_evidence_artifacts.py \
            tests/test_tcc_evidence_limits.py \
            tests/test_tcc_population_reporting.py \
            tests/test_tcc_editorial_feedback.py \
            tests/test_tcc_objective_alignment.py \
            tests/test_editorial_visualizations.py \
            tests/test_compile_tcc.py \
            tests/test_validate_tcc_pdf.py \
            tests/test_versioned_snapshot.py \
            -q --tb=short 2>&1 | tee advisor-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Run prototype regression tests
        shell: bash
        run: |
          set +e
          python -m pytest prototype/tests -q --tb=short 2>&1 | tee prototype-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload source-validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-source-validation
          path: |
            research/advisor-tests.log
            prototype-tests.log
          if-no-files-found: warn
          retention-days: 7

  presentation-validation:
    name: presentation-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: presentation/package-lock.json

      - name: Install presentation dependencies
        working-directory: presentation
        run: npm ci

      - name: Test presentation contracts
        working-directory: presentation
        run: npm test

      - name: Validate presentation content
        working-directory: presentation
        run: npm run validate

      - name: Build presentation
        working-directory: presentation
        run: npm run build -- --base /ccw/presentation/

  site-validation:
    name: site-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate current MMAT page
        run: node scripts/generate-mmat-page.mjs

      - name: Validate public site contract
        run: |
          node scripts/site.test.mjs
          node --test scripts/workflow-contract.test.mjs

  tcc-editable-pptx-validation:
    name: tcc-editable-pptx-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PowerPoint validation dependency
        run: python -m pip install --disable-pip-version-check "python-pptx==1.0.2"

      - name: Validate parallel editable PPTX export
        run: python scripts/generate_tcc_presentation.py --check

  latex-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-lang-portuguese \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic

      - name: Set up Python for document consistency checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF inspection dependency
        run: python -m pip install --disable-pip-version-check "pypdf==6.10.0"

      - name: Prepare legacy IFC template paths
        working-directory: results/tcc
        run: |
          test -d abnetx2
          ln -sfn abnetx2 abntex2

      - name: Compile TCC
        run: python scripts/compile_tcc.py --output results/tcc/main.pdf --diagnostics .tcc-build/aux

      - name: Verify compiled front matter and page destinations
        run: python scripts/validate_tcc_pdf.py --pdf results/tcc/main.pdf --aux .tcc-build/aux

      - name: Upload LaTeX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-latex-diagnostics
          path: |
            results/tcc/build.log
            results/tcc/main.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiled TCC
        uses: actions/upload-artifact@v4
        with:
          name: tcc-pdf
          path: results/tcc/main.pdf
          if-no-files-found: error
          retention-days: 7

  canonical-pdf-sync:
    name: canonical-pdf-sync
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: latex-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for read-only verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify committed PDF without creating commits
        run: python scripts/check_canonical_pdf.py
